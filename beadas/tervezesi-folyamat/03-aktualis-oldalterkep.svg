<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120"><rect width="1200" height="1120" fill="#F9F8F6"/><g font-family="Arial,sans-serif" fill="#2D2A26"><text x="48" y="54" font-size="32" font-weight="700">Agyagpad – az aktuális változat oldaltérképe</text><text x="48" y="86" font-size="18" font-weight="400">2026. november 14. · Új tartalom és előkészített küldés · Aktuális szerkezet</text><rect x="48" y="118" width="1104" height="94" rx="12" fill="#F9F8F6" stroke="#1B4D4F" stroke-width="1.5"/><text x="68" y="152" font-size="21" font-weight="700">Közös fejléc</text><text x="68" y="183" font-size="17" font-weight="400">Logó · Kezdőlap · Tanfolyamok · Műhely · Kapcsolat · Érdeklődöm → főoldali űrlap</text><rect x="48" y="244" width="760" height="124" rx="12" fill="#F9F8F6" stroke="#1B4D4F" stroke-width="1.5"/><text x="68" y="278" font-size="21" font-weight="700">1. Nyitó szekció  #kezdo</text><text x="68" y="309" font-size="17" font-weight="400">Főcím és két CTA · agyagot formáló kezek fotója · idézetkártya</text><text x="68" y="334" font-size="17" font-weight="400">Megnézem a tanfolyamokat → #tanfolyamok; műhely → #muhely</text><path d="M428 212 V244 m-5 -6 5 6 5-6" fill="none" stroke="#1B4D4F" stroke-width="1.5"/><rect x="48" y="400" width="760" height="150" rx="12" fill="#F9F8F6" stroke="#1B4D4F" stroke-width="1.5"/><text x="68" y="434" font-size="21" font-weight="700">2. Tanfolyamok  #tanfolyamok</text><text x="68" y="465" font-size="17" font-weight="400">Három élményalapú kártyasor, terrakotta ikonokkal</text><text x="68" y="490" font-size="17" font-weight="400">Részletek és árak → a program aloldali horgonya</text><text x="68" y="515" font-size="17" font-weight="400">Közvetlenül alattuk: türkiz hátterű közös tudnivalóblokk</text><path d="M428 368 V400 m-5 -6 5 6 5-6" fill="none" stroke="#1B4D4F" stroke-width="1.5"/><rect x="840" y="400" width="312" height="150" rx="12" fill="#F9F8F6" stroke="#1B4D4F" stroke-width="1.5"/><text x="860" y="434" font-size="21" font-weight="700">Tanfolyamok aloldal</text><text x="860" y="465" font-size="17" font-weight="400">tanfolyamok.html</text><text x="860" y="490" font-size="17" font-weight="400">Részletes árak, feltételek</text><text x="860" y="515" font-size="17" font-weight="400">Érdeklődés → főoldali űrlap</text><path d="M808 475 H840 m-6 -5 6 5-6 5" fill="none" stroke="#1B4D4F" stroke-width="1.5"/><rect x="48" y="582" width="760" height="150" rx="12" fill="#F9F8F6" stroke="#1B4D4F" stroke-width="1.5"/><text x="68" y="616" font-size="21" font-weight="700">3. Műhely és alkotó  #muhely</text><text x="68" y="647" font-size="17" font-weight="400">Fehér Dóra: 2009 óta · 15+ év / 1500+ tanítvány / 7000+ alkotás</text><text x="68" y="672" font-size="17" font-weight="400">Műhelybolt: asztalon szöveg balra, bögrés fotó jobbra</text><text x="68" y="697" font-size="17" font-weight="400">Műhelybolt CTA → muhely.html#keramiak</text><path d="M428 550 V582 m-5 -6 5 6 5-6" fill="none" stroke="#1B4D4F" stroke-width="1.5"/><rect x="840" y="582" width="312" height="150" rx="12" fill="#F9F8F6" stroke="#1B4D4F" stroke-width="1.5"/><text x="860" y="616" font-size="21" font-weight="700">Műhely és kerámiák</text><text x="860" y="647" font-size="17" font-weight="400">muhely.html#keramiak</text><text x="860" y="672" font-size="17" font-weight="400">Négy WebP-képes galéria</text><text x="860" y="697" font-size="17" font-weight="400">Kész tárgyak és munkafázisok</text><path d="M808 657 H840 m-6 -5 6 5-6 5" fill="none" stroke="#1B4D4F" stroke-width="1.5"/><rect x="48" y="764" width="760" height="124" rx="12" fill="#F9F8F6" stroke="#1B4D4F" stroke-width="1.5"/><text x="68" y="798" font-size="21" font-weight="700">4. Kapcsolat  #kapcsolat</text><text x="68" y="829" font-size="17" font-weight="400">Név, e-mail, program, üzenet · helyi bemutatóűrlap</text><text x="68" y="854" font-size="17" font-weight="400">Netlify-kód kész; a fogadó bekapcsolása és az éles próba hátravan</text><path d="M428 732 V764 m-5 -6 5 6 5-6" fill="none" stroke="#1B4D4F" stroke-width="1.5"/><rect x="840" y="764" width="312" height="124" rx="12" fill="#F9F8F6" stroke="#1B4D4F" stroke-width="1.5"/><text x="860" y="798" font-size="21" font-weight="700">Adatkezelési oldal</text><text x="860" y="829" font-size="17" font-weight="400">adatkezeles.html</text><text x="860" y="854" font-size="17" font-weight="400">Élesítés előtt véglegesítendő</text><path d="M808 826 H840 m-6 -5 6 5-6 5" fill="none" stroke="#1B4D4F" stroke-width="1.5"/><rect x="48" y="920" width="1104" height="94" rx="12" fill="#F9F8F6" stroke="#1B4D4F" stroke-width="1.5"/><text x="68" y="954" font-size="21" font-weight="700">Közös lábléc</text><text x="68" y="985" font-size="17" font-weight="400">Márka · cím és nyitvatartás · navigáció · adatkezelés · vizsgamunka és illusztrációk jelölése</text><path d="M428 888 V920 m-5 -6 5 6 5-6" fill="none" stroke="#1B4D4F" stroke-width="1.5"/><text x="48" y="1058" font-size="18" font-weight="400">Mobilon a tartalom egy oszlopba rendeződik; a főoldal négy szekciója megmarad.</text><text x="48" y="1088" font-size="17" font-weight="400">Az eredeti drótvázak a tervezési folyamatot, ez a kép a megtartott szerkezetet dokumentálja.</text></g></svg>